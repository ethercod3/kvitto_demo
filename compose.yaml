services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kvitto
      POSTGRES_USER: kvitto
      POSTGRES_PASSWORD: kvitto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitto -d kvitto"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://kvitto:kvitto@db:5432/kvitto
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-development-only-secret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
